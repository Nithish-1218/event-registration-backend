<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Event Registration System</h1>
    <p>Backend Development Workshop</p>
</header>
<main>
    <section class="card">
        <h2>Register for the Workshop</h2>
        <form id="registrationForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="college">College</label>
            <input type="text" id="college" placeholder="Enter your college" required>
            <label for="department">Department</label>
            <input type="text" id="department" placeholder="e.g. Information Technology" required>
            <button type="submit">Register Now</button>
        </form>
        <p id="message" role="status"></p>
    </section>
    <section class="card">
        <h2>Workshop Registrations</h2>
        <button id="loadRegistrations" type="button">View All Registrations</button>
        <p id="listMessage" role="status"></p>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>College</th>
                    <th>Department</th>
                </tr>
                </thead>
                <tbody id="registrationList"></tbody>
            </table>
        </div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
